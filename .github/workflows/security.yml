---
name: Security Scanning

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
      - name: Set up Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5  # v6.2.0
        with:
          go-version-file: Backend/go.mod
          cache: true
          cache-dependency-path: Backend/go.mod
      - name: Initialize CodeQL for Go
        uses: github/codeql-action/init@7211b7c8077ea37d8641b6271f6a365a22a5fbfa  # v4.36.0
        with:
          languages: go
          build-mode: manual
      - name: Build Go module for CodeQL
        working-directory: Backend
        run: go build ./...
      - name: Analyze Go
        uses: github/codeql-action/analyze@7211b7c8077ea37d8641b6271f6a365a22a5fbfa  # v4.36.0

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          fail-on-severity: high

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out complete history
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          fetch-depth: 0
      - name: Install pinned Gitleaks OSS CLI
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_ARCHIVE_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_ARCHIVE_SHA256  $archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" gitleaks
          mkdir --parents "$RUNNER_TEMP/bin"
          install "$RUNNER_TEMP/gitleaks" "$RUNNER_TEMP/bin/gitleaks"
      - name: Scan repository history for secrets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          log_range="--all"
          if [[ -n "$BASE_SHA" && -n "$HEAD_SHA" ]]; then
            log_range="$BASE_SHA..$HEAD_SHA"
          fi
          "$RUNNER_TEMP/bin/gitleaks" detect --source . \
            --log-opts="$log_range" \
            --redact \
            --report-format sarif \
            --report-path results.sarif \
            --no-banner
      - name: Upload redacted Gitleaks SARIF
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: gitleaks-sarif
          path: results.sarif
          if-no-files-found: warn
          retention-days: 7

  trivy:
    name: Trivy
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
      - name: Scan dependencies for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          exit-code: 1
          ignore-unfixed: false
      - name: Upload Trivy results to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa  # v4.36.0
        with:
          sarif_file: trivy.sarif
          category: trivy
      - name: Upload sanitized Trivy SARIF
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: trivy-sarif
          path: trivy.sarif
          if-no-files-found: warn
          retention-days: 7

  sbom:
    name: CycloneDX SBOM
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
      - name: Install CycloneDX GoMod
        uses: CycloneDX/gh-gomod-generate-sbom@efc74245d6802c8cefd925620515442756c70d8f  # v2.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          version: v1.10.0
      - name: Generate CycloneDX SBOM
        run: |
          cd Backend
          cyclonedx-gomod mod -licenses -json -output ../sbom.cdx.json
      - name: Upload CycloneDX SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: cyclonedx-sbom
          path: sbom.cdx.json
          if-no-files-found: error
          retention-days: 7

  security:
    name: Security
    if: always()
    needs: [codeql, dependency-review, gitleaks, trivy, sbom]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Enforce security results
        env:
          CODEQL_RESULT: ${{ needs.codeql.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
          GITLEAKS_RESULT: ${{ needs.gitleaks.result }}
          TRIVY_RESULT: ${{ needs.trivy.result }}
          SBOM_RESULT: ${{ needs.sbom.result }}
        run: |
          [[ "$CODEQL_RESULT" == "success" ]]
          [[ "$DEPENDENCY_REVIEW_RESULT" == "success" || "$DEPENDENCY_REVIEW_RESULT" == "skipped" ]]
          [[ "$GITLEAKS_RESULT" == "success" ]]
          [[ "$TRIVY_RESULT" == "success" ]]
          [[ "$SBOM_RESULT" == "success" ]]
