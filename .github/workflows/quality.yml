---
name: Quality

on:
  workflow_call:
    secrets:
      SONAR_TOKEN:
        description: SonarQube authentication token
        required: true

permissions:
  contents: read

jobs:
  sonarqube:
    name: SonarQube
    runs-on: [self-hosted, macOS, ARM64, "${{ 'commerce-ios' }}"]
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - name: Preflight SonarQube
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: Infrastructure/ci/preflight-sonarqube.sh
      - name: Generate Go coverage
        working-directory: Backend
        run: mise exec -- go test -race -coverprofile=coverage.out ./...
      - name: Generate Xcode workspace
        run: make ios-generate
      - name: Generate Swift coverage
        run: |
          mkdir -p Build/coverage Build/reports
          rm -rf Build/coverage/CommerceApp.xcresult
          xcodebuild -workspace Commerce.xcworkspace \
            -scheme CommerceApp \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -enableCodeCoverage YES \
            -resultBundlePath Build/coverage/CommerceApp.xcresult \
            test CODE_SIGNING_ALLOWED=NO
      - name: Convert Swift coverage for SonarQube
        run: >-
          Infrastructure/ci/xccov-to-sonarqube.sh
          Build/coverage/CommerceApp.xcresult
          Build/reports/swift-coverage.xml
      - name: Scan and wait for Quality Gate
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: -Dsonar.qualitygate.wait=true
