# SonarQube for OSS is required for public PR analysis targeting both main and develop.
sonar.organization=jerry-nows
sonar.projectKey=jerry-nows_learning-superpower
sonar.projectName=Learning Superpower Commerce
sonar.sourceEncoding=UTF-8
sonar.sources=Backend,Apps,Packages
sonar.tests=Backend,Apps,Packages
sonar.test.inclusions=Backend/**/*_test.go,Apps/**/Tests/**/*.swift,Apps/**/UITests/**/*.swift,Packages/**/Tests/**/*.swift
sonar.go.coverage.reportPaths=Backend/coverage.out
sonar.coverageReportPaths=Build/reports/core-coverage.xml,Build/reports/design-system-coverage.xml,Build/reports/commerce-app-coverage.xml
sonar.exclusions=**/.build/**,**/Derived/**,**/*.xcodeproj/**,**/*.xcworkspace/**,Backend/**/*_test.go,Apps/**/Tests/**,Apps/**/UITests/**,Packages/**/Tests/**
# Swift coverage conversion is informational until all package targets are
# included in the app scheme. Enforce the quality gate on the authoritative Go
# coverage report rather than lowering the global threshold for unmeasured
# Swift package lines.
sonar.coverage.exclusions=Apps/**,Packages/**,Backend/cmd/api/main.go,Backend/cmd/seed/main.go,Backend/internal/auth/redis_refresh_repository.go,Backend/internal/platform/migration/**
