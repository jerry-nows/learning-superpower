# Sourcery's published schema supports repository configuration here, but its
# current AI Review Rules are entered in the Sourcery Dashboard. Keep the
# copy-ready rules below synchronized with the dashboard; do not invent an
# unsupported YAML key for them.
version: '1'

# Dashboard Review Rule — path: Apps/**/*.swift,Packages/**/*.swift
# - Report only actionable Swift 6 correctness or data race findings. Verify
#   MainActor and other actor isolation, Sendable boundaries, and unstructured
#   Task lifetime; cite the affected file and line and explain a concrete fix.
# - Enforce Clean Architecture and MVVM-C boundaries: domain code must remain
#   framework-independent, Factory registrations must preserve dependency
#   direction, and XCoordinator must own navigation rather than view models.

# Dashboard Review Rule — path: Backend/**/*.go
# - Review Go changes for correctness, context propagation, error handling,
#   concurrency safety, resource lifetime, and clear service boundaries.
# - Apply OWASP guidance to authentication, authorization, input validation,
#   injection, sensitive-data exposure, and secret handling; cite the affected
#   file and line, impact, evidence, and a concrete remediation.

# Dashboard Review Rule — path: **/*
# - Prioritize correctness, security, and data race defects. Report only issues
#   supported by changed-code evidence; do not speculate or repeat a finding.
# - Require a regression test for every behavior fix and meaningful tests for
#   new behavior, including failure paths and concurrency-sensitive behavior.

# Dashboard Review Rule — path: **/*.swift,**/*.go
# - Do not report formatting-only or stylistic feedback already enforced by
#   SwiftLint or gofmt. Avoid duplicate noise and omit non-actionable praise.
