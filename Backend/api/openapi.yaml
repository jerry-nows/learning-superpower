openapi: 3.1.0
info:
  title: Ecommerce Authentication API
  version: 1.0.0
  description: >-
    Authentication contract. Access JWTs have an exact 60-second lifetime.
    Refresh tokens are opaque, randomly generated 256-bit values; only their
    SHA-256 digests are stored server-side. Examples intentionally use redacted
    placeholders and never contain credentials, keys, tokens, or DSNs.
servers:
  - url: http://localhost:8080
paths:
  /v1/auth/login:
    post:
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
            example: { email: user@example.invalid, password: '<redacted>' }
      responses:
        '200':
          description: Authenticated user and token pair
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthenticationFailed' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '408': { $ref: '#/components/responses/Timeout' }
        '500': { $ref: '#/components/responses/Internal' }
  /v1/auth/refresh:
    post:
      operationId: refresh
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
            example: { refresh_token: '<opaque-redacted-token>' }
      responses:
        '200':
          description: Rotated token pair
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/RefreshRejected' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '408': { $ref: '#/components/responses/Timeout' }
        '500': { $ref: '#/components/responses/Internal' }
  /v1/auth/logout:
    post:
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        '204': { description: User refresh sessions revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '408': { $ref: '#/components/responses/Timeout' }
        '500': { $ref: '#/components/responses/Internal' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access JWT bearer credential; expires exactly 60 seconds after issuance.
  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1, writeOnly: true }
    RefreshRequest:
      type: object
      required: [refresh_token]
      additionalProperties: false
      properties:
        refresh_token: { type: string, minLength: 1, writeOnly: true, description: Opaque 256-bit token; never a JWT. }
    User:
      type: object
      required: [id, status]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        status: { type: string, enum: [active, disabled] }
    Tokens:
      type: object
      required: [access_token, refresh_token, access_expires_at, refresh_expires_at]
      properties:
        access_token: { type: string, description: Signed JWT with an exact 60-second lifetime. }
        refresh_token: { type: string, description: Opaque 256-bit value; server stores digest only. }
        access_expires_at: { type: string, format: date-time }
        refresh_expires_at: { type: string, format: date-time }
    AuthResponse:
      type: object
      required: [user, tokens]
      properties:
        user: { $ref: '#/components/schemas/User' }
        tokens: { $ref: '#/components/schemas/Tokens' }
    ErrorResponse:
      type: object
      required: [code, message, retryable, trace_id]
      properties:
        code:
          type: string
          enum: [AUTH_INVALID_REQUEST, AUTH_METHOD_NOT_ALLOWED, AUTH_AUTHENTICATION_FAILED, AUTH_REFRESH_REJECTED, AUTH_UNAUTHORIZED, AUTH_AUTHENTICATION_CANCELLED, AUTH_REFRESH_CANCELLED, AUTH_LOGOUT_CANCELLED, AUTH_TOKEN_ISSUE_CANCELLED, AUTH_REPOSITORY_FAILED, AUTH_TOKEN_ISSUE_FAILED, AUTH_LOGOUT_FAILED, AUTH_INTERNAL]
        message: { type: string }
        retryable: { type: boolean }
        trace_id: { type: string }
        field_violations:
          type: array
          items:
            type: object
            required: [name, message]
            properties:
              name: { type: string }
              message: { type: string }
  responses:
    InvalidRequest:
      description: Malformed JSON, missing field, or unsupported content type.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' }, example: { code: AUTH_INVALID_REQUEST, message: request failed, retryable: false, trace_id: '<trace-id>' } } }
    AuthenticationFailed:
      description: Invalid login credentials (AUTH_AUTHENTICATION_FAILED).
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' }, example: { code: AUTH_AUTHENTICATION_FAILED, message: request failed, retryable: false, trace_id: '<trace-id>' } } }
    RefreshRejected:
      description: Expired, revoked or reused refresh token (AUTH_REFRESH_REJECTED).
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' }, example: { code: AUTH_REFRESH_REJECTED, message: request failed, retryable: false, trace_id: '<trace-id>' } } }
    Unauthorized:
      description: Missing or invalid bearer token (AUTH_UNAUTHORIZED is emitted at the logout boundary).
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' }, example: { code: AUTH_UNAUTHORIZED, message: request failed, retryable: false, trace_id: '<trace-id>' } } }
    MethodNotAllowed:
      description: Request method is not POST (AUTH_METHOD_NOT_ALLOWED).
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' }, example: { code: AUTH_METHOD_NOT_ALLOWED, message: request failed, retryable: false, trace_id: '<trace-id>' } } }
    Timeout:
      description: Authentication operation timed out or was cancelled (AUTH_AUTHENTICATION_CANCELLED, AUTH_REFRESH_CANCELLED, AUTH_LOGOUT_CANCELLED or AUTH_TOKEN_ISSUE_CANCELLED).
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' }, example: { code: AUTH_AUTHENTICATION_CANCELLED, message: request failed, retryable: false, trace_id: '<trace-id>' } } }
    Internal:
      description: Authentication repository, token issuance or logout failure (AUTH_REPOSITORY_FAILED, AUTH_TOKEN_ISSUE_FAILED, AUTH_LOGOUT_FAILED or AUTH_INTERNAL).
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' }, example: { code: AUTH_INTERNAL, message: request failed, retryable: false, trace_id: '<trace-id>' } } }
